name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed signing configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, sys
          value = os.environ.get('ANDROID_SIGNING', '')
          if not value:
              sys.exit('Missing repository secret ANDROID_SIGNING. Publication stopped; no random signing key will be generated.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-signing.json'
          path.write_text(value)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ANDROID_SIGNING_FILE=' + str(path) + '\n')
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Remove private signing configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing.json"
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.17-sourcecore >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+，固定签名，可覆盖安装稳定版。
          源核据点首版：夺取芯片后撤离，可选择正面强攻、潜行处置或扫描破解。
          守卫具备视线、声音警戒、失去目标后的搜索、掩体和侧翼移动；摄像头、中继器与终端可互动。
          第一人称枪械与近战、换弹、格挡、闪避、长按重击；手机和平板八键战斗布局。
          完成获得经验，可安装精准射击、低耗破解、轻盈闪避。首次现金奖励由现有银行账户支付，日志及成长保存。
          更新源核背景与三区社会特征。157 项自动测试通过，三条路线、成长存档与触控布局完成浏览器验证。
          据点为独立可选原型：武器与守卫使用程序模型，尚非全城战斗改造或正式骨骼枪械动画；实机性能与手感仍需游玩验证。
          NOTES
          gh release create v1.17-sourcecore android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 1.17 · 源核据点' --notes-file notes.md
