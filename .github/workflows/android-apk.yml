name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed signing configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, sys
          value = os.environ.get('ANDROID_SIGNING', '')
          if not value:
              sys.exit('Missing repository secret ANDROID_SIGNING. Publication stopped; no random signing key will be generated.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-signing.json'
          path.write_text(value)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ANDROID_SIGNING_FILE=' + str(path) + '\n')
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Remove private signing configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing.json"
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.18-urban >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+，固定签名，可覆盖安装稳定版。
          三区整体改造首轮：142 个外围街坊，澄湾 41、榆庭 52、东埠 49；规划面积仍为 30% / 45% / 25%。
          澄湾：低层玻璃园区、屋顶温室、简洁导视与绿地；榆庭：石材院落、坡屋顶、拱形门框、工艺社与座椅；东埠：密集高楼、开放工坊、外露设备与廉价霓虹。
          新增步道、连廊、居民活动点和座椅；地块抬平并移除旧水面与稻苗，修复城市地块仍被判定涉水的问题。
          原地块账户与农业产出保留，名称更新为科创园、生活院和试造坊，农业表现为楼内/屋顶培育。经济资金与源核据点兼容。
          160 项自动测试通过；三区碰撞与入口、三条战斗路线、成长存档、手机和平板布局完成浏览器验证。
          本轮为程序建筑与街景首版，原章节、特殊地标和部分旧设施保留。采用分块合并几何；手机和平板性能仍需实机验证。
          NOTES
          gh release create v1.18-urban android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 1.18 · 三区街坊' --notes-file notes.md
