name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed signing configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, sys
          value = os.environ.get('ANDROID_SIGNING', '')
          if not value:
              sys.exit('Missing repository secret ANDROID_SIGNING. Publication stopped; no random signing key will be generated.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-signing.json'
          path.write_text(value)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ANDROID_SIGNING_FILE=' + str(path) + '\n')
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Remove private signing configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing.json"
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.24-street-combat >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+，固定签名，可覆盖安装稳定版。
          小镇直接拔枪进入肩后第三人称射击：左键射击、右键瞄准、R换弹、Ctrl蹲伏、空格闪避、2/3收枪；手机复用触控战斗布局。
          普通居民察觉枪械逃离，枪声提高警戒；原生安保调度接通持枪追捕和反击，收枪不清除追捕。
          居民受伤取消到店消费并停工至当前轮次+3，停发工作工资，缺员影响真实店铺产出；康复重新按岗位和资金上岗。
          弹药和伤情随存档保存。菜单购买24发备用弹药，支付NT$20进入五金店并消耗库存。
          拔枪、开火、命中、逃跑、追捕、伤情、换弹与康复全部进入「日志」。沿用原作人物和授权枪械模型。
          178项测试通过；浏览器验证实际命中、自动追捕、安保伤害、停工工资、付费弹药、存档恢复及据点切换，无脚本错误。实机触控与性能仍需验证。
          NOTES
          gh release create v1.24-street-combat android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 1.24 · 小镇街头射击' --notes-file notes.md
