name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.12.0-locomotion >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+。
          主角地面移动加入起步缓动、快速收步和掉头减速。
          走跑步频按碰撞后的实际位移与混合动画的参考速度计算，减少撞墙踏步及速度不匹配。
          保留原版骨骼、战斗命中时机、骑乘和飞扑；日志名称与经济功能保持不变。
          这是动作优化第一轮，尚未加入专用转身动画、地面脚部 IK 或第一人称身体。高倍速仍属于超能力表现。
          114 项自动测试通过，真实主角模型运行检查通过；手机 / 平板手感仍需真机验证。
          个人测试签名可能与旧版不同，卸载会清除存档。
          NOTES
          gh release create v1.12.0-locomotion android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 手机 / 平板通用版 1.12 · 主角基础步态' --notes-file notes.md
