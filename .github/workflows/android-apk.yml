name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Publish phone touch edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          **适用设备：Android 手机 / 平板通用版（Android 8.0+）。**
          安装包：grandma-gta-phone-tablet.apk，同一个 APK 同时适配手机和平板。
          手机横竖屏紧凑布局；模拟摇杆支持斜向与轻推慢走。移动、滑动转视角和动作支持多指同时操作。
          常用动作保持在右侧，飞行、升降、补药、回正等收进「更多」。保留三种视角、自由鼠标转向和全部无敌能力。
          构建和签名校验通过，尚未完成真机验证。个人测试签名与旧版不同，已安装旧版时需要卸载后安装，本地存档会清除。
          NOTES
          if gh release view v1.3.0-phone >/dev/null 2>&1; then
            asset_id=$(gh api repos/$GH_REPO/releases/tags/v1.3.0-phone --jq '.assets[] | select(.name == "grandma-gta-god.apk") | .id')
            if [ -n "$asset_id" ]; then
              gh api --method PATCH "repos/$GH_REPO/releases/assets/$asset_id" -f name=grandma-gta-phone-tablet.apk -f label='手机 / 平板通用版 · Android 8.0+'
            fi
            gh release edit v1.3.0-phone --title '阿嬤俠盜 · 手机 / 平板通用版 1.3' --notes-file notes.md
            exit 0
          fi
          gh release create v1.3.0-phone android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 手机 / 平板通用版 1.3' --notes-file notes.md
