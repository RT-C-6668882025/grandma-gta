name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed signing configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, sys
          value = os.environ.get('ANDROID_SIGNING', '')
          if not value:
              sys.exit('Missing repository secret ANDROID_SIGNING. Publication stopped; no random signing key will be generated.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-signing.json'
          path.write_text(value)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ANDROID_SIGNING_FILE=' + str(path) + '\n')
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Remove private signing configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing.json"
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.14-town >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+，固定签名，可覆盖安装 1.13.1 稳定版。
          店铺位置固定，居民控股人可以变化；扶持 / 收购 / 撤资三种干预，经营者自动招聘、采购、扩建和分红。
          工资与经营利润的一部分购买玩家已有 GOD；能力影响工资和产出，显示累计售币收入及分红。
          政府独立公库：扶持、政策选择、更换执政者；税收支持民生补贴及公共岗位。满意度过低触发抗议、停工与政府更替。
          抗议居民会走向市政厅；店铺场景标签显示控股人，库存箱跟随经营变化。「日志」名称保持不变。
          128 项自动测试通过，包括资金守恒、收购支付、旧存档、持币积累和政府更替。经营与政府为第一版，数值平衡及真机体验继续优化。
          NOTES
          gh release create v1.14-town android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 1.14 · 店铺与政府' --notes-file notes.md
