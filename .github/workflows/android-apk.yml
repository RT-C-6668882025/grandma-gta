name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.10.0-controls >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+。
          统一顶部菜单，移除叠加工具条。左侧八方向摇杆、右侧弧形动作按钮；视角灵敏度默认 35%，菜单 → 更多可调整并保存。
          GOD 替代 BETA 名称，旧存档兼容。顶部显示游戏 GDP（最终消费口径，排除批发、换汇和资产转手）。
          默认 160 名实际场景居民，可每次新增 32 人，上限 240；有资金的企业招聘，资金不足仍会停工。
          导航显示地图目标、小地图边缘标记、地面连续圆点与目的地光柱。可瞬移到目标附近道路，再按引导抵达。
          日志作为独立入口：决策、下一轮变化、收支、就业、产业、游戏事件。随存档保留最近 10000 条，支持全选复制。
          NT$ / GOD 可定向增发至玩家、公库、指定居民、产业或资产专项账户；增发与已有资金注资分开。
          107 项自动测试通过。完整 Android 真机操作手感待验收。
          个人测试签名可能与旧版不同，卸载会清除存档。
          NOTES
          gh release create v1.10.0-controls android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 手机 / 平板通用版 1.10 · 触控 / 导航 / 决策日志' --notes-file notes.md
