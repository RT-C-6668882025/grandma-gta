name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-god-apk
          path: android/build/grandma-gta-god.apk
          retention-days: 30
      - name: Publish camera edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.1.0-camera >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          默认近距离第三人称跟随，C 键或视角按钮切换第一人称和上帝视角。
          下车恢复步行镜头距离，保留全部无敌版能力。Android 8.0 及以上，离线横屏。
          构建和签名校验通过，尚未完成真机验证。个人测试签名与旧版不同，已安装旧版时需要卸载后安装，本地存档会清除。
          NOTES
          gh release create v1.1.0-camera android/build/grandma-gta-god.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 三视角版 1.1' --notes-file notes.md
