name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed signing configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, sys
          value = os.environ.get('ANDROID_SIGNING', '')
          if not value:
              sys.exit('Missing repository secret ANDROID_SIGNING. Publication stopped; no random signing key will be generated.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-signing.json'
          path.write_text(value)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ANDROID_SIGNING_FILE=' + str(path) + '\n')
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Remove private signing configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing.json"
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.25-simple-console >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+，固定签名，可覆盖安装稳定版。
          控制台只保留四个页签：发币、买卖、持股、汇率。钱包和汇率常驻，删除统计卡、表格、曲线及其他控制入口。
          NT$ / GOD 定向发币；用NT$买卖GOD；手动固定汇率直接作用于工资、消费和兑换。
          两种货币均可购买店铺股份（1–100%），支付给原持有人，实际利润按持股份额自动分红；股份随存档保存。
          「日志」保留独立入口，经济继续自动运行；原作人物和街头第三人称射击保留。
          181项测试通过，验证双币持股、资金守恒、分红和存档；实机触控与布局仍需实际游玩验证。
          NOTES
          gh release create v1.25-simple-console android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 1.25 · 精简控制台' --notes-file notes.md
