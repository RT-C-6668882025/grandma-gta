name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.11.0-district >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+。
          新增「街区」入口：试验店铺经营卡可切换店铺、注资、调整每人工资、开停业、导航和查看日志。
          街区店铺显示可点击的营业 / 缺货 / 停业标牌，门前货箱数量随真实库存变化。
          试验街区的步行员工到店后才领取当轮工资并生产；前来消费的居民沿道路赴店，抵达后才付款和扣库存。战斗或受伤期间暂停到店消费。
          「日志」名称保持不变；店铺操作、收支和后续事件关联决策编号，可直接前往事件发生地点。
          此版先实现一个街区的循环，其他产业沿用原模拟规则。保留 GOD / NT$、定向增发、160 人场景和触控布局。
          110 项自动测试通过。完整真机体验仍待验证。
          个人测试签名可能与旧版不同，卸载会清除存档。
          NOTES
          gh release create v1.11.0-district android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 手机 / 平板通用版 1.11 · 可交互经济街区' --notes-file notes.md
