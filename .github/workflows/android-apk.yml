name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Publish town currency edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.7.0-town-currency >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+。
          现有居民拥有永久 ID，迁出后不会复用。复用现有 3D 路人，最多 24 人入场，其余后台模拟。
          新入口：能力 → 小镇经济 → 启用我的币。初始玩家 2,000 BETA、矿池 100；玩家独占发币权。给产业注资后，币实际用于工资、三种商品、批发与送货。
          菜市场与柑仔店关联生产库存；五金行、诊所、回收场、槟榔摊接工资与定期服务付款，具体服务效果仍沿用原玩法。其他商品与任务仍使用原钱包。
          地图点地点、搜索结果或空白位置即可建立道路参考导航；拖动只平移。
          军政、选举、警局财政及自动出生尚未实现。87 项自动测试通过；完整真机体验待验证。
          手机 / 平板通用。个人测试签名可能与旧版不同；卸载重装会清除本地存档。游戏内模拟，不接真实区块链。
          NOTES
          gh release create v1.7.0-town-currency android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 手机 / 平板通用版 1.7 · 我的币 / 产业' --notes-file notes.md
