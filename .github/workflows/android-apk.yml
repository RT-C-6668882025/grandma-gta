name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Publish town economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.4.0-economy >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+。
          小镇货币系统第一版：12 户居民经济账户、有限钱包、工资 / 消费 / 补货、库存价格、送货运费与增发实验。
          按 N 或能力菜单 → 小镇经济打开；手机也可通过「更多」进入。菜市场领货，柑仔店交货。
          三种商品接入真实库存与小镇钱包，原无敌钱包和任务收入独立；NPC 经济行为尚未绑定场景动作。
          自动测试、构建与签名校验通过；真机验证待完成。测试签名可能与旧版不同，卸载重装会清除存档。
          NOTES
          gh release create v1.4.0-economy android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 手机 / 平板通用版 1.4 · 小镇经济' --notes-file notes.md
