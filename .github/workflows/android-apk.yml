name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed signing configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, sys
          value = os.environ.get('ANDROID_SIGNING', '')
          if not value:
              sys.exit('Missing repository secret ANDROID_SIGNING. Publication stopped; no random signing key will be generated.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-signing.json'
          path.write_text(value)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ANDROID_SIGNING_FILE=' + str(path) + '\n')
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Remove private signing configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing.json"
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.21-cooperation >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+，固定签名，可覆盖安装稳定版。
          店铺面板接入源核授权：投入 NT$100，三个实际完成生产或服务的轮次后落地。
          落地后每名员工工资增加 NT$2，生产岗位每人产出增加 2；正经营利润的 10% 在保留运营资金后支付给阿嬤。
          缺人、停业、关闭生产会暂停合作；进度、落地、授权收入与终止记录进入「日志」。
          合作随固定店铺保存，控股人变化不重置；可随时终止，不虚构退款或发行奖励。
          复用原作者美术资源，移除临时库存方块，没有新增人物或武器占位模型。
          168 项自动测试通过；浏览器验证授权、实时进度、日志、存档恢复和终止入口。实机手感及经济平衡仍需游玩验证。
          NOTES
          gh release create v1.21-cooperation android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 1.21 · 源核合作' --notes-file notes.md
