name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed signing configuration
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, sys
          value = os.environ.get('ANDROID_SIGNING', '')
          if not value:
              sys.exit('Missing repository secret ANDROID_SIGNING. Publication stopped; no random signing key will be generated.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-signing.json'
          path.write_text(value)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ANDROID_SIGNING_FILE=' + str(path) + '\n')
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify simulation and input tests
        run: node --test tests/*.test.mjs
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-phone-tablet-apk
          path: android/build/grandma-gta-phone-tablet.apk
          retention-days: 30
      - name: Remove private signing configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing.json"
      - name: Publish world economy edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.19-centers >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          手机 / 平板通用版 · Android 8.0+，固定签名，可覆盖安装稳定版。
          新增三个公共中心：东埠样机集市、榆庭公庭、澄湾开放园，分别布置样机摊位、喷泉与露台、光伏廊架与展示装置。
          地图新增公共空间分类，支持搜索、导航、瞬移，目的地介绍保留在选中提示中。
          街坊路网连上原道路；避开旧设施，移除新步道交叉口的自动电线杆，改用专门布置的街坊路灯。
          公共中心加入座椅和居民活动点；原街坊数量、三区面积比例、地块账户和农业生产规则保持兼容。
          163 项自动测试通过；浏览器验证三个中心的路线碰撞、入口、地图搜索和瞬移。
          公共中心为程序场景首版；样机展示、咖啡露台和展示装置目前是环境设施，未增加购买或科技研发玩法。实机性能仍需验证。
          NOTES
          gh release create v1.19-centers android/build/grandma-gta-phone-tablet.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 1.19 · 街区中心' --notes-file notes.md
