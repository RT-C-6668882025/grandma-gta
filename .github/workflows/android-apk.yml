name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build offline personal test APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-gta-god-apk
          path: android/build/grandma-gta-god.apk
          retention-days: 30
      - name: Publish free-look edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.0-free-look >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          鼠标停在画面边缘持续转向，可水平连续旋转；移回中央停止。扩大三种镜头的俯仰范围。
          手动转向后不自动回正，Z 或触屏「视角回正」恢复跟随。保留三种视角和全部无敌能力，README 已改为本魔改分支说明。
          构建和签名校验通过，尚未完成真机验证。个人测试签名与旧版不同，已安装旧版时需要卸载后安装，本地存档会清除。
          NOTES
          gh release create v1.2.0-free-look android/build/grandma-gta-god.apk --target "$GITHUB_SHA" --title '阿嬤俠盜 · 自由视角版 1.2' --notes-file notes.md
